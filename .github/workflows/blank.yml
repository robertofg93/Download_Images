name: Download Docker Image as TAR

on:
  workflow_dispatch:  # Permite ejecutarlo manualmente desde la pestaña Actions
    inputs:
      image:
        description: 'Nombre de la imagen (ej: nginx:latest)'
        required: true
        default: 'container-registry.oracle.com/goldengate/goldengate-free:23'

jobs:
  download-image:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar la imagen desde Docker Hub (pública)
      - name: Pull Docker image
        run: docker pull ${{ github.event.inputs.image }}

      # 2. Guardar la imagen como archivo .tar
      - name: Save image to TAR
        run: |
          # Se reemplazan ':' y '/' para un nombre de archivo seguro
          IMAGE_NAME=$(echo "${{ github.event.inputs.image }}" | tr '/:' '__')
          docker save -o "${IMAGE_NAME}.tar" ${{ github.event.inputs.image }}
          ls -lh "${IMAGE_NAME}.tar"

      # 3. (Opcional) Comprimir el .tar para reducir su tamaño
      - name: Compress TAR with gzip
        run: |
          IMAGE_NAME=$(echo "${{ github.event.inputs.image }}" | tr '/:' '__')
          gzip "${IMAGE_NAME}.tar"
          ls -lh "${IMAGE_NAME}.tar.gz"

      # 4. Subir el archivo como artefacto descargable
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-tar
          path: |
            *.tar
            *.tar.gz
          retention-days: 7
          if-no-files-found: error
