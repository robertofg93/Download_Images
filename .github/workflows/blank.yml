name: Download Docker Image as TAR

on:
  workflow_dispatch:  # Permite ejecutarlo manualmente desde la pestaña Actions
    inputs:
      image:
        description: 'Nombre de la imagen (ej: nginx:latest)'
        required: true
        default: 'nginx:latest'

jobs:
  download-image:
    runs-on: ubuntu-latest

    steps:
      # 1. (Opcional) Iniciar sesión en Docker Hub para imágenes privadas
      #    Elimina este paso si la imagen es pública.
      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Descargar la imagen desde Docker Hub
      - name: Pull Docker image
        run: docker pull ${{ github.event.inputs.image }}

      # 3. Guardar la imagen como archivo .tar
      - name: Save image to TAR
        run: |
          # Se reemplazan los caracteres ':' y '/' para un nombre de archivo seguro
          IMAGE_NAME=$(echo "${{ github.event.inputs.image }}" | tr '/:' '__')
          docker save -o "${IMAGE_NAME}.tar" ${{ github.event.inputs.image }}
          ls -lh "${IMAGE_NAME}.tar"

      # 4. (Opcional) Comprimir el .tar para reducir su tamaño (útil para imágenes grandes)
      - name: Compress TAR with gzip
        run: |
          IMAGE_NAME=$(echo "${{ github.event.inputs.image }}" | tr '/:' '__')
          gzip "${IMAGE_NAME}.tar"
          ls -lh "${IMAGE_NAME}.tar.gz"

      # 5. Subir el archivo como artefacto descargable
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-tar
          path: |
            *.tar
            *.tar.gz
          retention-days: 7   # Días que estará disponible el artefacto
          if-no-files-found: error
